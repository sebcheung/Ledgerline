# Fly.io deploy configuration (SPEC.md §12 Phase 7).
#
# Deliberately not launched by this change -- no `fly launch`, no app or
# managed Postgres created, no secrets set. See docs/DEPLOY.md for the
# one-time manual steps and .github/workflows/cd.yml for the CD workflow
# this config feeds.
app = "ledgerline"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # "migrations on release" (SPEC.md §12): runs in a temporary machine with
  # the app's env/secrets attached, before any traffic shifts to the new
  # release. A non-zero exit aborts the deploy outright -- /readyz's
  # existing alembic-head check (ledger/api/health.py) is the second,
  # continuous layer behind this one-shot gate.
  release_command = "alembic upgrade head"
  strategy = "rolling"

# Two process groups sharing one image (the Dockerfile's CMD is overridden
# per group below). Without the `worker` group, ledger.webhooks.dispatcher
# never runs in production and every webhook delivery stays `pending`
# forever -- see docs/DECISIONS.md Phase 7.
[processes]
  app    = "uvicorn ledger.api.main:app --host 0.0.0.0 --port 8000 --workers 1"
  worker = "python -m worker.webhook_worker"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  DEMO_ENABLED = "false"
  DASHBOARD_ENABLED = "true"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Exactly one web machine, running exactly one uvicorn worker (see
  # `--workers 1` above): the in-process rate limiter
  # (ledger/api/ratelimit.py) and in-process metrics counters
  # (ledger/observability/metrics.py) are both only correct for a single
  # process. See docs/DECISIONS.md Phase 7.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.http_checks]]
    path = "/readyz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"

# Scraped by Fly's built-in Prometheus over the private network -- see
# ledger/api/routes/metrics.py for why GET /metrics is unauthenticated.
[[metrics]]
  port = 8000
  path = "/metrics"
  processes = ["app"]

# Phase 8: a second, independent scrape target for the worker process's own
# Counters/Histogram (webhook_stale_claims_swept_total, webhook_delivery_
# attempts_total, webhook_delivery_latency_seconds) -- these are only ever
# incremented inside worker/webhook_worker.py's interpreter, which the app
# process's /metrics has no way to see (see docs/DECISIONS.md Phase 8).
# worker/webhook_worker.py starts this server itself via
# prometheus_client.start_http_server; no [http_service]/[[services]]
# block is needed for Fly's private-network Prometheus to reach it.
[[metrics]]
  port = 9090
  path = "/metrics"
  processes = ["worker"]
