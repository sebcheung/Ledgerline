name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@localhost:5432/ledgerline
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: alembic upgrade head
      # Prove the downgrade path (which drops the append-only trigger) works
      # before a later phase stacks another migration on top of it.
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
      - name: Restore hypothesis example database
        uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ hashFiles('tests/property/**') }}
          restore-keys: hypothesis-
      - run: pytest --cov=ledger --cov=dashboard --cov-report=term-missing --cov-fail-under=90
      - name: Assert dashboard assets ship in the wheel
        # Hatchling's packages = [...] ships the whole directory tree for a
        # first-party package (templates, static/*, all file types) filtered
        # only by VCS ignores -- an assumption worth pinning rather than
        # trusting silently, since a future refactor (e.g. adding these
        # paths to .gitignore) could break it without any test noticing.
        run: |
          pip wheel --no-deps -w /tmp/wh .
          python -m zipfile -l /tmp/wh/*.whl | grep -q 'dashboard/templates/index.html'
          python -m zipfile -l /tmp/wh/*.whl | grep -q 'dashboard/static/vendor/htmx.min.js'
