services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@db:5432/ledgerline
      LOG_LEVEL: INFO
      # The dashboard's "Run demo scenario" button (SPEC.md §12 Phase 6) --
      # off by default everywhere else (ledger/config.py). Writes real
      # transactions; never enable this against a ledger you care about.
      DEMO_ENABLED: "true"
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn ledger.api.main:app --host 0.0.0.0 --port 8000"

  webhook-worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@db:5432/ledgerline
      LOG_LEVEL: INFO
      # Short retry budget so the demo scenario's DLQ and pending retries
      # are visible within seconds instead of hours -- configuration only,
      # the production defaults in ledger/config.py are untouched.
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_BASE_DELAY_SECONDS: "1"
      WEBHOOK_MAX_DELAY_SECONDS: "30"
    ports:
      # This process's own webhook_stale_claims_swept_total/webhook_delivery_
      # attempts_total/webhook_delivery_latency_seconds -- not visible on the
      # app service's :8000/metrics (see docs/DECISIONS.md Phase 8).
      - "9090:9090"
    command: python -m worker.webhook_worker

volumes:
  pgdata:
