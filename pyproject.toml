[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerline"
version = "0.1.0"
description = "Idempotent payments ledger and reconciliation engine"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<2",
  "uvicorn[standard]>=0.30,<0.31",
  "structlog>=24.4,<25",
  # Runtime as of Phase 5: ledger.webhooks.dispatcher makes outbound HTTP
  # calls to deliver webhooks. Was dev-only through Phase 4 (test client
  # only).
  "httpx>=0.27,<0.28",
  # Runtime as of Phase 6: dashboard/ renders Jinja2 templates and ships in
  # the wheel (see [tool.hatch.build.targets.wheel] below), so a production
  # `pip install .` must import it without the [dev] extra -- same
  # reasoning as the httpx promotion above.
  "jinja2>=3.1,<4",
  # Runtime as of Phase 7: ledger.observability.metrics is imported by
  # ledger.core.posting to increment SPEC.md §9's counters, so a bare
  # `pip install .` must import it -- same reasoning as httpx/jinja2 above.
  "prometheus-client>=0.20,<0.22",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<0.7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=5,<6",
  "pytest-timeout>=2.3,<3",
  "hypothesis>=6.112,<7",
  "testcontainers[postgres]>=4.8,<5",
  # Phase 8 slice 4: tests/unit/test_alert_rules.py parses ops/alerts.yml to
  # cross-check its PromQL expressions against the registered metric names.
  # Not a transitive dependency of anything else in this project as of this
  # slice -- checked via `pip show` on every existing dependency before
  # adding this rather than assuming it rides in for free.
  "pyyaml>=6,<7",
  "types-pyyaml>=6,<7",
]
# Phase 7 (SPEC.md §12): a separate extra, not `dev` -- CI installs
# `.[dev]` on every run, and locust's gevent-based dependency stack has no
# business being in that install for a load test that's run manually
# (see loadtest/README.md).
loadtest = [
  "locust>=2.31,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["ledger", "worker", "dashboard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "PT", "SIM", "DTZ", "C4", "RET"]
# B008: FastAPI's Depends(...) in a default argument is the standard pattern, not a bug.
extend-ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ledger", "worker", "dashboard"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# migrations/ and loadtest/ have no __init__.py, so mypy resolves their
# files to bare top-level module names (e.g. "env", "locustfile") rather
# than "migrations.env" / "loadtest.locustfile" -- a `[[tool.mypy.overrides]]
# module = "migrations.*"` pattern silently never matches. `exclude` works
# on file paths instead, so it isn't affected by that module-naming quirk.
# loadtest/ is also not part of the ledger/worker/dashboard wheel and is
# only ever run manually (see loadtest/README.md); locust itself ships no
# type stubs.
exclude = ["^migrations/", "^loadtest/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra --durations=10"
timeout = 120
markers = [
  "integration: requires a running or testcontainers-provisioned Postgres",
  "slow: multi-second concurrency test or high-example-count property test",
  "fault: fault-injection test (SPEC.md §10)",
  "chaos: worker-crash chaos test (dispatcher cancellation/reclaim exhaustion)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:testcontainers.*",
  # Phase 5's mock webhook receiver (tests/mock_receiver) runs a real
  # uvicorn server so fault tests can produce genuine socket-level
  # failures (ASGITransport can't). uvicorn's websocket protocol import
  # trips websockets' own legacy-module deprecation warning even though
  # this app never uses websockets -- see docs/DECISIONS.md Phase 5.
  "ignore::DeprecationWarning:uvicorn.*",
  "ignore::DeprecationWarning:websockets.*",
  # asyncio's ProactorEventLoop (Windows) tears down asyncpg's sockets on
  # garbage collection rather than explicit close, which surfaces as
  # unraisable ResourceWarning/RuntimeWarning noise during test teardown.
  # Linux (CI) uses the selector event loop and does not hit this.
  "ignore::ResourceWarning",
  "ignore:coroutine .* was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["ledger", "dashboard"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
